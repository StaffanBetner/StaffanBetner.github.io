---
layout: default
---

<article class="page{% if page.page_class %} {{ page.page_class }}{% endif %}">

  <h1>{{ page.title }}</h1>

  {% if page.outline %}
  <aside class="page-outline" aria-label="On this page">
    <div class="page-outline-inner">
      <p>On this page</p>
      <ul>
        {% for item in page.outline %}
        <li{% if item.subsection %} class="outline-subsection"{% endif %}><a href="#{{ item.id }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </aside>

  <details class="page-outline-mobile">
    <summary>On this page</summary>
    <ul>
      {% for item in page.outline %}
      <li{% if item.subsection %} class="outline-subsection"{% endif %}><a href="#{{ item.id }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </details>
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>
</article>

{% if page.outline %}
<script>
  (function () {
    var links = Array.from(document.querySelectorAll('.page-outline a, .page-outline-mobile a'));
    var headings = links.slice(0, {{ page.outline.size }}).map(function (link) {
      return document.getElementById(link.hash.slice(1));
    }).filter(Boolean);

    function updateOutline() {
      var current = headings[0];
      headings.forEach(function (heading) {
        if (heading.getBoundingClientRect().top <= 120) current = heading;
      });
      links.forEach(function (link) {
        if (current && link.hash === '#' + current.id) {
          link.setAttribute('aria-current', 'location');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    }

    window.addEventListener('scroll', updateOutline, { passive: true });
    window.addEventListener('hashchange', updateOutline);
    document.querySelectorAll('.page-outline-mobile a').forEach(function (link) {
      link.addEventListener('click', function () {
        document.querySelector('.page-outline-mobile').open = false;
      });
    });
    updateOutline();
  }());
</script>
{% endif %}
